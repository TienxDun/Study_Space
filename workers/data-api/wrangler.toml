# Cấu hình deploy data-api bằng Wrangler (tùy chọn — có thể dán code trên Dashboard).
# Trước khi deploy: wrangler d1 create zenspace   -> copy database_id vào dưới.
name = "data-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "zenspace"
database_id = "DÁN_DATABASE_ID_VÀO_ĐÂY"

[vars]
FIREBASE_PROJECT_ID = "zenspace-d10m13y26"
ALLOWED_ORIGINS = "https://zenstudy.space,http://localhost:3001"

# Không đặt secret trong file này. Nếu cần, dùng:
#   wrangler secret put ADMIN_TOKEN
