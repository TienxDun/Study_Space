<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Đổ bóng mềm tự nhiên -->
    <filter id="saucerShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cupDropShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="steamSoftBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>

    <!-- Nền khối Squircle ấm áp -->
    <linearGradient id="bgGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2a2623"/>
      <stop offset="50%" stop-color="#181514"/>
      <stop offset="100%" stop-color="#0c0b0a"/>
    </linearGradient>

    <!-- Viền phản quang vát mép bo tròn mượt mà (không có vệt ngang đứt đoạn) -->
    <linearGradient id="bevelRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Quầng sáng ấm dịu phía sau tách -->
    <radialGradient id="backlight" cx="50%" cy="56%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Thân tách cà phê 3D hình trụ với ánh sáng tự nhiên -->
    <linearGradient id="cupBody3D" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="24%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Miệng tách phản quang -->
    <linearGradient id="cupRim3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Mặt cà phê đậm đà có chiều sâu lòng cốc -->
    <linearGradient id="coffeeSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f0f05"/>
      <stop offset="100%" stop-color="#4a1d07"/>
    </linearGradient>

    <!-- Quai tách 3D ôm sát thân -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Đĩa lót nổi khối 3D -->
    <linearGradient id="saucerTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Làn khói mềm mại, thanh thoát lo-fi mờ dần -->
    <linearGradient id="steamSoft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fed7aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- 1. Nền Squircle 3D cao cấp (đã loại bỏ đường kẻ ngang lỗi) -->
  <rect x="6" y="6" width="116" height="116" rx="34" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="116" height="116" rx="34" fill="url(#backlight)"/>
  <rect x="7" y="7" width="114" height="114" rx="33" fill="none" stroke="url(#bevelRim)" stroke-width="1.8"/>

  <!-- 2. Đĩa lót tách (Saucer) - Cốc sẽ đặt CHẠM KHÍT lên đĩa này -->
  <g filter="url(#saucerShadow)">
    <!-- Bóng đổ của đĩa xuống nền -->
    <ellipse cx="58" cy="91" rx="33" ry="4" fill="#000000" opacity="0.4"/>
    <!-- Độ dày thành đĩa -->
    <path d="M 25 87 C 25 87, 32 92.5, 58 92.5 C 84 92.5, 91 87, 91 87 C 91 88.5, 84 93.5, 58 93.5 C 32 93.5, 25 88.5, 25 87 Z" fill="#9a3412"/>
    <!-- Mặt đĩa phía trên -->
    <ellipse cx="58" cy="87.5" rx="33" ry="4.5" fill="url(#saucerTopGrad)"/>
    <!-- Lòng lõm đặt đáy tách cà phê -->
    <ellipse cx="58" cy="87.8" rx="22" ry="2.6" fill="#b45309" opacity="0.45"/>
    <!-- Viền sáng phản quang trên mép đĩa -->
    <path d="M 28 87 C 37 90.2, 79 90.2, 88 87" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 3. Quai tách cà phê 3D (nối liền tự nhiên với thân cốc) -->
  <g filter="url(#cupDropShadow)">
    <path d="M 77 56 C 92 56, 92 74, 76 74" fill="none" stroke="url(#handleGrad)" stroke-width="6.2" stroke-linecap="round"/>
    <path d="M 78 55.5 C 90.5 55.5, 90.5 71, 78 71" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 4. Thân tách cà phê 3D - Đặt VỪA VẶN trên đĩa lót (không còn bay lơ lửng) -->
  <g filter="url(#cupDropShadow)">
    <!-- Bóng đổ của đáy cốc lên mặt đĩa -->
    <ellipse cx="58" cy="86" rx="19" ry="2.8" fill="#000000" opacity="0.5"/>
    
    <!-- Thân cốc: vát nhẹ hình ly gốm sứ sang trọng, đáy cốc chạm mặt đĩa ở Y=86 -->
    <path d="M 35 52 H 81 L 76.5 82.5 C 76.5 86, 39.5 86, 39.5 82.5 Z" fill="url(#cupBody3D)"/>
    
    <!-- Vệt bóng sáng dọc thân cốc tạo độ tròn 3D -->
    <path d="M 40 52.5 L 43.5 81 C 43.5 84.5, 48 85.5, 52 85.5 C 46 84, 45 79, 45 74 L 42 52.5 Z" fill="#ffffff" opacity="0.26"/>
    
    <!-- Miệng cốc hình elip -->
    <ellipse cx="58" cy="52" rx="23" ry="5.5" fill="url(#cupRim3D)"/>
    <!-- Mặt cà phê đậm đà sóng sánh -->
    <ellipse cx="58" cy="52.6" rx="20.5" ry="4.3" fill="url(#coffeeSurface)"/>
    <!-- Gợn bọt cà phê phản quang nhẹ -->
    <path d="M 50 52.2 C 54 51.5, 62 51.5, 66 53" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 5. Làn khói Lo-fi ấm áp, thanh thoát (không bị chói hay cứng như trước) -->
  <g filter="url(#steamSoftBlur)">
    <path d="M 47 43 C 43 34, 51 28, 47 18" fill="none" stroke="url(#steamSoft)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 59 44 C 55 33, 64 26, 60 14" fill="none" stroke="url(#steamSoft)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 70 42 C 67 34, 73 29, 70 21" fill="none" stroke="url(#steamSoft)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- 6. Nốt nhạc bay bổng thanh lịch -->
  <g filter="url(#cupDropShadow)">
    <circle cx="93" cy="34" r="3.4" fill="url(#cupBody3D)"/>
    <circle cx="92.2" cy="33" r="0.9" fill="#ffffff" opacity="0.8"/>
    <path d="M 96 34 V 23 H 104.5 V 27.5" fill="none" stroke="url(#cupBody3D)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 95.5 23.4 H 104" stroke="#ffffff" stroke-width="0.7" opacity="0.65"/>
  </g>
</svg>
